name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['v3/**', 'docs/**', '.github/ga-snippet.html', '.claude/skills/story-to-playbook/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node --test v3/test/*.test.mjs
      # the site root is docs/ (purpose page). The player is the v3 single-file build; it is served at /v3/ and also at /v2/,
      # so old /v2/ links (and their #<repo>:<id> playbooks) open v3. The v2 and MVP sources have been removed from the repo.
      - run: node v3/build-single.mjs
      # Google Analytics goes into the deployed pages only: the same build is the Claude artifact, whose sandbox blocks external scripts
      - run: mkdir -p _site/v2 _site/v3 && cp -r docs/. _site/ && cat .github/ga-snippet.html v3/dist/sim-xp.html > _site/v3/index.html && cp _site/v3/index.html _site/v2/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
