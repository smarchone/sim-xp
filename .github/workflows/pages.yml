name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['home/**', 'v2/**', '.claude/skills/story-to-playbook/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node --test v2/test/*.test.mjs
      # the playbook gallery is the site root and the player is at /v2/; the MVP is deprecated and not deployed
      - run: cp -rL home _site && cp -rL v2 _site/v2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
