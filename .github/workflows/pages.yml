name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['v2/**', 'docs/**', '.claude/skills/story-to-playbook/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node --test v2/test/*.test.mjs
      # the site root is docs/ (purpose page); the single-file build (player, side panel and bundled playbooks) is served at /v2/. The MVP is deprecated and not deployed
      - run: node v2/build-single.mjs
      - run: mkdir -p _site/v2 && cp -r docs/. _site/ && cp v2/dist/sim-xp.html _site/v2/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
